<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>
      {% block titulo %}Portal do Fornecedor (simulado){% endblock %}
    </title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f6f8;
        color: #222;
      }
      header {
        background: #1f3a5f;
        color: #fff;
        padding: 14px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header a {
        color: #fff;
      }
      main {
        max-width: 900px;
        margin: 24px auto;
        background: #fff;
        padding: 24px;
        border-radius: 8px;
      }
      .aviso {
        background: #fff3cd;
        border: 1px solid #ffe69c;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid #e3e6ea;
      }
      td.custo,
      th.custo {
        text-align: right;
      }
      .paginacao {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
      }
      .btn {
        display: inline-block;
        padding: 8px 14px;
        background: #1f3a5f;
        color: #fff;
        border: 0;
        border-radius: 6px;
        text-decoration: none;
        cursor: pointer;
      }
      .btn.desativado {
        background: #b8c0cc;
        pointer-events: none;
      }
      .erro {
        color: #b00020;
        margin-bottom: 12px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
      }
      input {
        padding: 8px;
        width: 100%;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Portal do Fornecedor</strong>
      {% if session.get("logado") %}<a
        href="{{ url_for('logout') }}"
        data-testid="sair"
        >Sair</a
      >{% endif %}
    </header>
    <main>
      <div class="aviso">
        Ambiente de <strong>simulação</strong>: dados fictícios, criado apenas
        para demonstrar o RPA.
      </div>
      {% block conteudo %}{% endblock %}
    </main>
  </body>
</html>
